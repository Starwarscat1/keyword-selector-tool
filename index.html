<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyword Selector Tool</title>
  <style>
    /* Import a clean, professional font */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      font-family: 'Inter', Arial, sans-serif;
      font-size: 16px;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #333;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 10px;
      font-size: 1rem;
      font-family: 'Inter', Arial, sans-serif;
      line-height: 1.5;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 10px 15px;
      font-size: 1rem;
      font-family: 'Inter', Arial, sans-serif;
      font-weight: 500;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #007BFF;
      color: #fff;
      transition: background 0.2s;
    }

    button:hover {
      background: #0056b3;
    }

    .checkbox-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checkbox-controls {
      display: flex;
      gap: 10px;
    }

    .checkbox-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: #fff;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .checkbox-container label {
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 400;
    }

    .checkbox-container input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
    }

    .output-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    /* Notification styling */
    .notification {
      font-size: 0.9rem;
      color: #28a745;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      .checkbox-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <h1>Keyword Selector Tool</h1>
  <div class="container">
    <div class="input-section">
      <textarea id="inputText" placeholder="Enter your text here..."></textarea>
      <button id="clearBtn">Clear</button>
    </div>
    <div class="checkbox-section">
      <div class="checkbox-controls">
        <button id="selectAllBtn">Select All</button>
        <button id="deselectAllBtn">Deselect All</button>
      </div>
      <div id="checkboxContainer" class="checkbox-container"></div>
    </div>
    <div class="output-section">
      <textarea id="outputText" readonly placeholder="Selected keywords will appear here..."></textarea>
      <button id="copyBtn">Copy</button>
      <span id="copyNotification" class="notification"></span>
    </div>
  </div>
  <script>
  (function(){
    const inputText = document.getElementById('inputText');
    const clearBtn = document.getElementById('clearBtn');
    const checkboxContainer = document.getElementById('checkboxContainer');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const deselectAllBtn = document.getElementById('deselectAllBtn');
    const outputText = document.getElementById('outputText');
    const copyBtn = document.getElementById('copyBtn');
    const copyNotification = document.getElementById('copyNotification');

    function parseWords(text){
      return [...new Set(text.split(/\s+/).filter(w => w))];
    }

    function updateCheckboxes(){
      const words = parseWords(inputText.value);
      checkboxContainer.innerHTML = '';
      words.forEach(word => {
        const id = 'chk_' + word;
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = id;
        checkbox.value = word;
        checkbox.addEventListener('change', updateOutput);
        const span = document.createElement('span');
        span.textContent = word;
        span.style.marginLeft = '5px';
        label.appendChild(checkbox);
        label.appendChild(span);
        checkboxContainer.appendChild(label);
      });
      updateOutput();
    }

    function updateOutput(){
      const selected = Array.from(checkboxContainer.querySelectorAll('input[type="checkbox"]:checked'))
        .map(chk => chk.value);
      outputText.value = selected.map(w => '#' + w).join(' ');
    }

    inputText.addEventListener('input', updateCheckboxes);
    clearBtn.addEventListener('click', () => { inputText.value = ''; updateCheckboxes(); });
    selectAllBtn.addEventListener('click', () => {
      checkboxContainer.querySelectorAll('input[type="checkbox"]').forEach(chk => chk.checked = true);
      updateOutput();
    });
    deselectAllBtn.addEventListener('click', () => {
      checkboxContainer.querySelectorAll('input[type="checkbox"]').forEach(chk => chk.checked = false);
      updateOutput();
    });
    copyBtn.addEventListener('click', () => {
      outputText.select();
      document.execCommand('copy');
      copyNotification.textContent = 'Copied to clipboard!';
      copyNotification.style.opacity = '1';
      setTimeout(() => { copyNotification.style.opacity = '0'; }, 2000);
    });

    // initialize
    updateCheckboxes();
  })();
  </script>
</body>
</html>
